name: Refresh project activity

on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Récupérer l'activité de chaque dépôt
        env:
          PROJECTS_READ_TOKEN: ${{ secrets.PROJECTS_READ_TOKEN }}
        run: node scripts/refresh.mjs

      - name: Commit si changement
        run: |
          if ! git diff --quiet -- projects.json; then
            git config user.name "chantiers-bot"
            git config user.email "actions@users.noreply.github.com"
            git add projects.json
            git commit -m "chore: refresh project activity [auto]"
            git push
          else
            echo "Rien à committer."
          fi
